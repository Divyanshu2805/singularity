spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: intelligence-service

  datasource:
    # A separate logical database on the same local Postgres server the other services use — no shared
    # tables/FKs with account-service's or workspace-service's databases.
    url: jdbc:postgresql://localhost:9010/singularity-intelligence-db
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      # Flyway (db/migration/V1__init.sql) owns the schema, not Hibernate - same fix account-service/workspace-
      # service already applied for the persisted-enum/ddl-auto:update CHECK-constraint trap (docs/schema/).
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  ai:
    openai:
      api-key: ${OPENROUTER_API_KEY}
      base-url: https://openrouter.ai/api
      chat:
        options:
          model: x-ai/grok-4.5
          temperature: 0.0
          stream-usage: true
          max-tokens: 32000

usage:
  # What reserveBudget() claims against the daily counter before a build turn starts (UsageServiceImpl). It is an
  # admission ticket, not a cap on the turn: the true cost is trued up afterward by reconcileBudget, and a turn that
  # costs more than this simply leaves less for the next one. It is sized just under what an ordinary two-file build
  # costs (70,294 tokens observed), so that a plan with a 100,000 allowance still admits a build after an idea
  # interview has spent a little - at the earlier 150,000 it was capped to the whole allowance, and a build was
  # only admitted while nothing at all had been used that day. Not spring.ai.openai.chat.options.max-tokens, which is
  # only the model's output ceiling: a tool-calling turn resends its whole growing conversation on every round, so
  # input dominates its cost.
  build-reservation-tokens: 60000
  # What the idea interview and the code lens reserve - a small fraction of a build, since neither writes files or loops
  # on tool calls. Reserving the build amount for them made each one demand a whole build's room (UsageServiceImpl).
  light-reservation-tokens: 12000

internal-service:
  shared-secret: ${INTERNAL_SERVICE_SHARED_SECRET}

feign:
  client:
    config:
      default:
        # API-05: an unbounded downstream call can stall a request indefinitely - session authentication itself
        # calls account-service (RemoteSessionAuthenticator), so a slow account-service would otherwise stall
        # most requests here. Feign's own bounded Retryer (FeignResilienceConfig, common-lib) only retries a
        # RetryableException (connect/read timeout, connection refused) - never a decoded 4xx/5xx response - so
        # a real downstream failure still surfaces once, not retried blindly.
        connectTimeout: 2000
        readTimeout: 5000

firebase:
  project-id: ${FIREBASE_PROJECT_ID}
  credentials-path: ${FIREBASE_CREDENTIALS_PATH}

app:
  auth:
    session-cookie:
      name: __Host-vc_session
      max-age: 5d
      secure: true
    revocation-check-interval: 60s

server:
  port: ${INTELLIGENCE_SERVICE_PORT:8083}
  # The caller's real address from X-Forwarded-For, trusting only private-range hops - see account-service's note.
  forward-headers-strategy: native

# CODE_REVIEW.md DEP-036: liveness/readiness on a separate port from server.port, so Kubernetes probes hit the pod
# directly and /actuator/health is never reachable through this service's own port - no Service or gateway route
# ever forwards to management.server.port. show-details: never keeps the response a bare UP/DOWN, not component
# internals (DB connection state, etc).
management:
  server:
    port: ${MANAGEMENT_SERVER_PORT:9404}
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true
