spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: intelligence-service

  datasource:
    # A separate logical database on the same local Postgres server the other services use — no shared
    # tables/FKs with account-service's or workspace-service's databases.
    url: jdbc:postgresql://localhost:9010/singularity-intelligence-db
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      # Flyway (db/migration/V1__init.sql) owns the schema, not Hibernate - same fix account-service/workspace-
      # service already applied for the persisted-enum/ddl-auto:update CHECK-constraint trap (docs/schema/).
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  ai:
    openai:
      api-key: ${OPENROUTER_API_KEY}
      base-url: https://openrouter.ai/api
      chat:
        options:
          model: x-ai/grok-4.5
          temperature: 0.0
          stream-usage: true
          max-tokens: 32000

# Which model, and how much reasoning, each kind of call asks for (AiCallProperties, ModelCalls). A kind left out
# uses the model above with the provider's default reasoning. The kinds are build, repair, interview, lesson, explain
# and suggest; each takes `model` and `reasoning-effort`. A lesson explains a few changed lines it is handed, so it
# asks for little reasoning - which is most of the wait for its first word.
ai:
  calls:
    lesson:
      reasoning-effort: low

usage:
  # How much of the daily allowance a build turn holds for itself while it runs (UsageServiceImpl, BudgetHolds). A hold
  # keeps another call of the same user from claiming the same room; it is not spending and the meter never shows it.
  # A turn is granted this much or whatever is free, whichever is less, and its hold grows while there is allowance to
  # grow into. It used to be added to the day's counter as if spent and corrected afterwards, which made the meter jump
  # at the start of every build, and a build was refused unless the whole amount was free.
  build-reservation-tokens: 60000
  # How much must be free for a build to be admitted at all: enough to send the prompt and the project's files and get
  # a useful part of an answer back. Below this the request is a 402, and the chat says so before one is typed.
  build-minimum-tokens: 10000
  # The same two figures for the idea interview and the code lens, which are a small fraction of a build - neither
  # writes files or loops on tool calls.
  light-reservation-tokens: 12000
  light-minimum-tokens: 1500

# The limits a build turn runs inside (GenerationProperties, BuildTurn). Every wait in a turn is bounded: a provider
# that accepts a request and then sends nothing used to hold the project's one generation slot forever.
generation:
  # Silence on the model's stream before its call is abandoned. Generous on purpose - a reasoning model can think for
  # a minute or more before its first token, and an abandoned reply is still paid for.
  idle-timeout: 3m
  # One model call, and the whole turn including every continuation and repair.
  attempt-timeout: 10m
  turn-timeout: 20m
  # The first wait before asking a rate-limited provider again; the second and third waits are two and three times it.
  busy-pause: 4s
  # How many times a turn may ask the model to carry on a reply that stopped before it wrote what it planned, and how
  # many times it may ask for what a check of the written files found to be repaired - an edit that could not be
  # applied, a file that does not parse, an import that does not resolve, an error from the compiler when the files
  # are type-checked in the project's running preview. Each is a further model call.
  max-continuations: 2
  max-repairs: 3

internal-service:
  shared-secret: ${INTERNAL_SERVICE_SHARED_SECRET}

feign:
  client:
    config:
      default:
        # API-05: an unbounded downstream call can stall a request indefinitely - session authentication itself
        # calls account-service (RemoteSessionAuthenticator), so a slow account-service would otherwise stall
        # most requests here. Feign's own bounded Retryer (FeignResilienceConfig, common-lib) only retries a
        # RetryableException (connect/read timeout, connection refused) - never a decoded 4xx/5xx response - so
        # a real downstream failure still surfaces once, not retried blindly.
        connectTimeout: 2000
        readTimeout: 5000

firebase:
  project-id: ${FIREBASE_PROJECT_ID}
  credentials-path: ${FIREBASE_CREDENTIALS_PATH}

app:
  auth:
    session-cookie:
      name: __Host-vc_session
      max-age: 5d
      secure: true
    revocation-check-interval: 60s

server:
  port: ${INTELLIGENCE_SERVICE_PORT:8083}
  # The caller's real address from X-Forwarded-For, trusting only private-range hops - see account-service's note.
  forward-headers-strategy: native

# CODE_REVIEW.md DEP-036: liveness/readiness on a separate port from server.port, so Kubernetes probes hit the pod
# directly and /actuator/health is never reachable through this service's own port - no Service or gateway route
# ever forwards to management.server.port. show-details: never keeps the response a bare UP/DOWN, not component
# internals (DB connection state, etc).
management:
  server:
    port: ${MANAGEMENT_SERVER_PORT:9404}
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true
