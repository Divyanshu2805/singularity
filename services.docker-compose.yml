version: '3.9'

services:
  pgvector:
    image: pgvector/pgvector:0.8.1-pg18-trixie
    container_name: pgvector-singularity
    environment:
      # The server's own maintenance database. Each service's database is created by the init script below.
      POSTGRES_DB: postgres
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "9010:5432"
    volumes:
      - pgvector-data:/var/lib/postgresql
      # Creates each service's own database on first-ever container init - see the file's own comment. Only
      # runs against a brand-new data volume; docs/local-development/resetting-data.md, "Resetting local data", has the steps.
      - ./infra/postgres-init:/docker-entrypoint-initdb.d
    restart: unless-stopped

  minio:
    # CODE_REVIEW.md OPS-01: pinned to the version actually running when this was checked, not `latest` - a
    # floating tag means a plain `docker compose pull` silently changes what every local dev and CI run is
    # actually testing against.
    image: ghcr.io/divyanshu2805/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: minio-singularity
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    ports:
      - "9000:9000"    # API
      - "9001:9001"    # Console
    volumes:
      - minio-data:/data
    restart: unless-stopped

volumes:
  minio-data:
  pgvector-data: