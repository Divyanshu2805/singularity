spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: account-service

  datasource:
    # A separate logical database on the same local Postgres server — every service owns its own database
    # (docs/schema/). No tables/FKs shared with the other services' databases.
    url: jdbc:postgresql://localhost:9010/singularity-account-db
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      # Flyway (db/migration/V1__init.sql) owns the schema now, not Hibernate — validate only checks the
      # entities still match what's actually there. This is the concrete fix for the persisted-enum/
      # ddl-auto:update trap documented in docs/schema/: Hibernate never generates or checks a CHECK
      # constraint in validate mode, so that entire failure class doesn't exist here.
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration

internal-service:
  shared-secret: ${INTERNAL_SERVICE_SHARED_SECRET}

firebase:
  project-id: ${FIREBASE_PROJECT_ID}
  credentials-path: ${FIREBASE_CREDENTIALS_PATH}

app:
  auth:
    session-cookie:
      name: __Host-vc_session
      max-age: 5d
      secure: true
    revocation-check-interval: 60s

stripe:
  api:
    secret: ${STRIPE_SECRET}
  webhook:
    secret: ${STRIPE_WEBHOOK_SECRET}
  price:
    pro: ${STRIPE_PRICE_PRO}
    business: ${STRIPE_PRICE_BUSINESS}

billing:
  # How long a PAST_DUE subscription keeps entitling after it first went delinquent (SubscriptionServiceImpl,
  # BILL-05) - after this, a user with no further Stripe update reads back as free without needing another webhook.
  past-due-grace-days: 7

client.url: http://localhost:5173

server:
  port: ${ACCOUNT_SERVICE_PORT:8081}
  # Behind cloudflared and the Gateway every request arrives from a private pod address, so without this the rate
  # limiter and the security-events trail see one client for everybody. Tomcat reads X-Forwarded-For from the right and
  # skips only private-range hops (its default internal proxies), so what a client forges at the left is ignored.
  forward-headers-strategy: native

# CODE_REVIEW.md DEP-036: liveness/readiness on a separate port from server.port, so Kubernetes probes hit the pod
# directly and /actuator/health is never reachable through this service's own port - no Service or gateway route
# ever forwards to management.server.port. show-details: never keeps the response a bare UP/DOWN, not component
# internals (DB/Redis connection state, etc).
management:
  server:
    port: ${MANAGEMENT_SERVER_PORT:9404}
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true
