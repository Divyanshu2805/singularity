spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: workspace-service

  datasource:
    # A separate logical database on the same local Postgres server the other services use — no tables/FKs
    # shared with account-service's singularity-account-db or intelligence-service's database.
    url: jdbc:postgresql://localhost:9010/singularity-workspace-db
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      # Flyway (db/migration/V1__init.sql) owns the schema, not Hibernate - same fix account-service already
      # applied for the persisted-enum/ddl-auto:update CHECK-constraint trap (docs/schema/).
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: localhost
      port: 6379

internal-service:
  shared-secret: ${INTERNAL_SERVICE_SHARED_SECRET}

feign:
  client:
    config:
      default:
        # API-05: an unbounded downstream call can stall a request indefinitely - session authentication itself
        # calls account-service (RemoteSessionAuthenticator), so a slow account-service would otherwise stall
        # most requests here. Feign's own bounded Retryer (FeignResilienceConfig, common-lib) only retries a
        # RetryableException (connect/read timeout, connection refused) - never a decoded 4xx/5xx response - so
        # a real downstream failure still surfaces once, not retried blindly.
        connectTimeout: 2000
        readTimeout: 5000

firebase:
  project-id: ${FIREBASE_PROJECT_ID}
  credentials-path: ${FIREBASE_CREDENTIALS_PATH}

app:
  auth:
    session-cookie:
      name: __Host-vc_session
      max-age: 5d
      secure: true
    revocation-check-interval: 60s
  security:
    # GET paths that need no session: the public, read-only page of a shared app. Nothing else in this service is
    # anonymous; a POST here (the fork) still needs a signed-in caller and the CSRF header.
    public-get-paths: /api/public/**

minio:
  url: http://localhost:9000
  access-key: ${MINIO_ACCESS_KEY}
  secret-key: ${MINIO_SECRET_KEY}
  project-bucket: projects
  # Where the starter template a new project is seeded from actually lives - CODE_REVIEW.md DATA-03 flagged these as
  # hardcoded constants living apart from every other bucket name, which does come from configuration.
  template-bucket: starter-projects
  template-name: react-vite-tailwind-shadcn-starter
  # CODE_REVIEW.md AI-05: immutable, content-addressed revision blobs - a dedicated bucket so it is structurally
  # impossible for the K8s preview syncer's `mc mirror` (scoped to project-bucket/{projectId}/) to ever touch it.
  blob-bucket: project-blobs

# CODE_REVIEW.md AI-09: isolated build/typecheck validation on a staged revision before it publishes. Off by
# default - see RevisionValidationProperties' javadoc for why - until real per-turn latency/cluster-load numbers
# justify turning it on. `command` is confirmed against the real starter template's package.json/tsconfig.json,
# not guessed; change it here, not in code, if the template's checks change.
revision-validation:
  enabled: false
  command: npx tsc --noEmit
  install-timeout: 2m
  build-timeout: 2m
  output-max-chars: 8000

# How large one project may grow (ProjectFileLimits). Checked where every write to a project lands, before anything
# is stored. A first build is about 40 files and 150 KB; the largest project measured was 74 files and 137 KB.
project-files:
  max-files: 500
  max-file-bytes: 1048576
  max-project-bytes: 26214400

# The kind namespace, Redis and MinIO bucket the live-preview pipeline runs against (PreviewRouter's Redis keys
# are per-hostname).
preview:
  namespace: singularity-ai
  # The kubeconfig context of the local kind cluster. Named here so previews never depend on - or follow - whichever
  # context kubectl happens to point at. Every deployed manifest sets PREVIEW_KUBE_CONTEXT to blank, which means the
  # pod's own service account.
  kube-context: ${PREVIEW_KUBE_CONTEXT:kind-singularity}
  public-scheme: http
  public-domain: localhost
  public-port: 8090
  runner-port: 5173
  storage-alias: myminio
  bucket: ${minio.project-bucket}
  idle-timeout: 10m
  # 4m, not 2m: a fresh npm install on a 2-core production node runs noticeably slower than on a real dev
  # machine, and this is a safety ceiling, not a performance target - a longer bound costs nothing when a
  # preview boots normally in well under a minute either way.
  boot-timeout: 4m
  # How long a start waits in line when every runner is busy before it gives up and says so. A runner comes free
  # when a preview stops or idles out (idle-timeout), so this is long enough to outlast a burst and short enough
  # that nobody watches a spinner for the length of someone else's session.
  queue-timeout: 5m
  route-ttl: 90s
  # Signs the short-lived access token appended to every previewUrl this service hands out (SEC-06): a bare
  # hostname is otherwise a permanent, unauthenticated bearer link the proxy has no way to revoke. The proxy
  # (proxy/index.js) verifies the same signature with the same secret - PREVIEW_ACCESS_TOKEN_SECRET must be set
  # identically on both. Deliberately a separate secret from internal-service.shared-secret: one signs a browser-
  # facing, comparatively low-stakes token, the other authenticates full machine-to-machine API access - a leak of
  # one shouldn't compromise the other.
  access-token-secret: ${PREVIEW_ACCESS_TOKEN_SECRET}
  access-token-ttl: 6h
  port-forward:
    # Local development: this service opens and keeps open the forwards into the kind cluster's Redis and proxy
    # pods itself (PreviewPortForwarder), so a preview never depends on a separate terminal having been left
    # running. A local port something else already holds - the k8s/dev-port-forward scripts - is left to it.
    # Every deployed manifest sets PREVIEW_PORT_FORWARD_ENABLED=false: on a real cluster both are reached directly.
    enabled: ${PREVIEW_PORT_FORWARD_ENABLED:true}
    forwards:
      - name: redis
        pod-labels:
          app: redis
        pod-port: 6379
        local-port: 6379
      - name: preview proxy
        pod-labels:
          app: singularity-proxy
        pod-port: 8080
        local-port: 8090

# Published apps: a production build of one revision, built in a runner pod and served by the preview proxy from the
# bucket below (docs/architecture/decisions/0008-published-apps.md). The public domain is its own setting so published
# apps can move to a domain of their own without a code change; until then it follows the preview domain. The proxy
# reads the same domain as PUBLISHED_DOMAIN.
publishing:
  public-scheme: ${PUBLISHING_PUBLIC_SCHEME:${preview.public-scheme}}
  public-domain: ${PUBLISHING_PUBLIC_DOMAIN:${preview.public-domain}}
  public-port: ${PUBLISHING_PUBLIC_PORT:${preview.public-port}}
  bucket: published-apps
  # Live apps one owner may have, by plan name. account-service's plan table has no column for this, and a second
  # schema change for a number nobody has yet needed to vary was not worth it; a plan not listed gets default-limit.
  plan-limits:
    Free: 1
    Pro: 3
    Business: 10
  default-limit: 1
  max-builds-per-hour: 10
  min-build-interval: 30s
  # How long a build waits for a runner when every one is busy, then fails as "try again in a moment".
  runner-wait: 90s
  install-timeout: 4m
  build-timeout: 4m
  collect-timeout: 1m
  max-source-files: 500
  max-source-bytes: 20971520
  max-output-files: 1000
  max-output-bytes: 52428800
  # A retired build is deleted this long after it stopped serving, so a request already in flight is never cut off.
  retire-after: 2m
  heartbeat-stale-after: 45s
  log-max-chars: 8000

client.url: http://localhost:5173

server:
  port: ${WORKSPACE_SERVICE_PORT:8082}
  # The caller's real address from X-Forwarded-For, trusting only private-range hops - see account-service's note.
  forward-headers-strategy: native

# CODE_REVIEW.md DEP-036: liveness/readiness on a separate port from server.port, so Kubernetes probes hit the pod
# directly and /actuator/health is never reachable through this service's own port - no Service or gateway route
# ever forwards to management.server.port. show-details: never keeps the response a bare UP/DOWN, not component
# internals (DB/Redis/MinIO connection state, etc).
management:
  server:
    port: ${MANAGEMENT_SERVER_PORT:9404}
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true
