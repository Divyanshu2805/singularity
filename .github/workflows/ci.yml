name: CI

# CODE_REVIEW.md QA-03 / CODE_TODO.md GATE-05: the reactor and frontend suites have been run by hand before every
# push up to now. This is what makes every "tests pass" / "clean build" claim in this repo's history durable instead
# of a one-time manual check - it runs the same commands CLAUDE.md documents as this project's own build/test
# workflow, nothing CI-specific invented on top.
#
# Deliberately not attempted here (see CODE_TODO.md GATE-05 for the fuller list): Flyway migration checks against a
# real Postgres, and a browser-journey smoke test - both need live infrastructure this job doesn't stand up. The
# backend suite needs neither database nor cluster (CLAUDE.md: "A bare `./mvnw test` passes"), which is exactly why
# it's safe to run here as-is.
#
# docs/deployment/ci-cd.md: on a push to main, once every test job passes, this also builds all 8 arm64
# images, pushes them to GHCR tagged with the commit SHA, waits for the owner's approval (the `approve` job), and
# deploys to the Oracle cluster over Tailscale - a failed smoke test rolls the affected services back automatically.
# A pull request only ever runs the test jobs:
# it never sees a secret and never deploys (every build/deploy job below is gated on `github.event_name != 'pull_request'`).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      sha:
        description: "Commit SHA to (re)deploy. Leave blank to build and deploy the latest main."
        required: false

concurrency:
  group: ci-${{ github.ref }}
  # Never cancel a push-to-main run mid-flight - it may be mid-deploy, and an aborted `kubectl apply`/rollout is
  # worse than letting a superseded run finish. A pull request's tests are safe to cancel-and-replace as usual.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: divyanshu2805
  DEPLOY_SHA: ${{ inputs.sha || github.sha }}

jobs:
  backend:
    name: Backend reactor (build + test)
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_dispatch'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up JDK 25
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Build and test every module's jar
        # A single reactor build, not per-module: common-lib must be resolved from the in-progress reactor, not a
        # pre-installed ~/.m2 copy - see CLAUDE.md's shared-~/.m2-jar gotcha for why building modules independently
        # is the wrong shape even locally.
        run: ./mvnw --batch-mode --no-transfer-progress clean package

      - name: Upload the reactor's jars for the image-build job
        # docker/java-service.Dockerfile packages a jar it did not build itself (docs/deployment/container-images.md) -
        # this is what lets the image job (a separate, arm64 runner) use the exact jar this job just tested, not a
        # fresh rebuild that could theoretically differ.
        if: github.event_name == 'push'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: service-jars
          path: |
            discovery-service/target/discovery-service-*.jar
            gateway-service/target/gateway-service-*.jar
            account-service/target/account-service-*.jar
            workspace-service/target/workspace-service-*.jar
            intelligence-service/target/intelligence-service-*.jar
          retention-days: 1

  frontend:
    name: Frontend (typecheck + lint + build + test)
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_dispatch'
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies (from the committed lockfile)
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit -p tsconfig.app.json

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm test

  proxy:
    name: Preview proxy (test)
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_dispatch'
    defaults:
      run:
        working-directory: proxy
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: proxy/package-lock.json

      - name: Install dependencies (from the committed lockfile)
        run: npm ci

      - name: Unit tests
        run: npm test

  preview-pipeline:
    name: Live preview on a kind cluster (start, fetch, stop)
    # The preview pipeline - Kubernetes, MinIO, Redis, the proxy - is mocked everywhere in the ordinary suite, so
    # until this job it was verified only by hand. It starts a real preview of the starter template on a throwaway
    # kind cluster, fetches the page through the real proxy, changes a file and a package, kills the runner, waits in
    # line for one, and stops (PreviewPipelineIT). Both kind and kubectl are preinstalled on the runner image.
    #
    # It gates the deploy (see `approve`): a change that breaks starting a preview should not reach production on
    # the strength of tests that never start one. The only thing it needs from outside the runner is the public npm
    # registry, which a real preview needs too.
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_dispatch'
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up JDK 25
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Create the kind cluster
        # The same config local development uses, so the kubelet PID limit the runner pods rely on is in force here
        # too. The context it creates is `kind-singularity`, which is what the test asks for by name.
        run: kind create cluster --name singularity --config k8s/kind-config.yaml --wait 120s

      - name: Stand up the preview pipeline in its own namespace
        run: bash k8s/preview-test-cluster.sh --context kind-singularity

      - name: Start a real preview, fetch its page, change it, stop it
        run: >
          ./mvnw --batch-mode --no-transfer-progress -pl common-lib,workspace-service test
          -Dtest=PreviewPipelineIT -Dsurefire.failIfNoSpecifiedTests=false

      - name: Report how long each start took
        if: always()
        run: |
          if [ -f workspace-service/target/preview-timings.txt ]; then
            { echo '### Preview start timings (kind, no pre-installed node_modules)'; echo '```'; cat workspace-service/target/preview-timings.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Show the cluster's state when the test failed
        if: failure()
        run: |
          kubectl --context kind-singularity -n singularity-it get pods -o wide -L status,project-id || true
          kubectl --context kind-singularity -n singularity-it get events --sort-by=.lastTimestamp | tail -40 || true
          kubectl --context kind-singularity -n singularity-it logs deployment/singularity-proxy --tail=80 || true
          kubectl --context kind-singularity -n singularity-it logs -l app=runner -c syncer --tail=40 || true

  build-java-images:
    name: Build image (${{ matrix.module }})
    needs: [backend]
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04-arm
    strategy:
      matrix:
        include:
          - module: discovery-service
            image: discovery
          - module: gateway-service
            image: gateway
          - module: account-service
            image: account
          - module: workspace-service
            image: workspace
          - module: intelligence-service
            image: intelligence
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: service-jars
          path: .
          # Every module's jar lands together in the download - upload-artifact flattens the source directory
          # structure by default, so this brings each one back under its own <module>/target/ the Dockerfile expects.
          merge-multiple: false

      - name: Restore jar paths after artifact download
        # actions/upload-artifact@v4 preserves the relative path structure of the glob it was given, so this is
        # already correct - this step exists only to fail loudly (not silently ship an empty image) if that ever
        # stops being true.
        run: test -f "${{ matrix.module }}/target/${{ matrix.module }}-"*.jar

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: docker/java-service.Dockerfile
          build-args: MODULE=${{ matrix.module }}
          platforms: linux/arm64
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/singularity-${{ matrix.image }}:${{ env.DEPLOY_SHA }}

  build-frontend-image:
    name: Build image (frontend)
    needs: [frontend]
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04-arm
    # Every VITE_FIREBASE_*/APP_DOMAIN value this job's build-args need is a *production environment* variable
    # (GitHub Settings -> Environments -> production -> Variables), not a repository-wide one - without this key,
    # `vars.*` resolves to an empty string here with no error, and the frontend image silently bakes in a broken
    # Firebase config (live-verified: the deployed site's sign-in page failed with "Firebase sign-in isn't
    # configured" even though every variable was correctly named and set - just not visible to this job).
    environment: production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: frontend
          platforms: linux/arm64
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/singularity-frontend:${{ env.DEPLOY_SHA }}
          # docs/deployment/configuration.md: every VITE_FIREBASE_* entry is a GitHub *variable*, not a
          # secret - none of them are sensitive, they only identify the Firebase project to the browser. Same
          # names as frontend/.env.example (VITE_FIREBASE_API_KEY/AUTH_DOMAIN/PROJECT_ID/APP_ID) - not derived
          # from the separate, backend-only firebase-project-id in the oracle overlay's app-config.yaml, though both
          # must name the same (production) Firebase project.
          build-args: |
            VITE_FIREBASE_API_KEY=${{ vars.VITE_FIREBASE_API_KEY }}
            VITE_FIREBASE_AUTH_DOMAIN=${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
            VITE_FIREBASE_PROJECT_ID=${{ vars.VITE_FIREBASE_PROJECT_ID }}
            VITE_FIREBASE_APP_ID=${{ vars.VITE_FIREBASE_APP_ID }}
            VITE_CSP_FRAME_ORIGINS=https://*.${{ vars.PREVIEW_ROOT_DOMAIN }}
            VITE_PAYMENTS_TEST_MODE=true

  build-proxy-image:
    name: Build image (preview-proxy)
    needs: [proxy]
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: proxy
          platforms: linux/arm64
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/singularity-preview-proxy:${{ env.DEPLOY_SHA }}

  build-preview-runner-image:
    name: Build image (preview-runner)
    # No test job of its own to depend on - this image only pre-installs the starter template's own npm packages
    # (docker/preview-runner.Dockerfile), nothing from this repo's source is compiled into it. Consumed by the warm
    # runner pool's seed-node-modules init container (deploy/k8s/base/runner-pods.yaml), so `deploy` waits for it.
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: workspace-service/src/main/resources/starter-templates/react-vite-tailwind-shadcn-starter
          file: docker/preview-runner.Dockerfile
          platforms: linux/arm64
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/singularity-preview-runner:${{ env.DEPLOY_SHA }}

  approve:
    name: Approve the production deploy
    needs: [build-java-images, build-frontend-image, build-proxy-image, build-preview-runner-image, preview-pipeline]
    # Runs on a normal push AND on a manual redeploy (workflow_dispatch). On a push every build job must have
    # succeeded, and so must the live-preview test, which no build job depends on and would otherwise not hold a
    # deploy back. On a manual redeploy every build job is skipped by design (they're gated to push-only - a redeploy
    # reuses images already pushed for that SHA), so there "skipped" is the expected result. The two cases are kept
    # apart on purpose: a push whose test job failed also leaves its build job "skipped" (a job whose `needs` failed
    # is skipped, not failed), and accepting "skipped" on a push once deployed image tags that were never built.
    # `always()` is required so this job is even considered when its needs were skipped rather than run.
    if: |
      always() && github.ref == 'refs/heads/main' && (
        (github.event_name == 'push' &&
          needs.build-java-images.result == 'success' &&
          needs.build-frontend-image.result == 'success' &&
          needs.build-proxy-image.result == 'success' &&
          needs.build-preview-runner-image.result == 'success' &&
          needs.preview-pipeline.result == 'success') ||
        (github.event_name == 'workflow_dispatch' &&
          needs.build-java-images.result == 'skipped' &&
          needs.build-frontend-image.result == 'skipped' &&
          needs.build-proxy-image.result == 'skipped' &&
          needs.build-preview-runner-image.result == 'skipped' &&
          needs.preview-pipeline.result == 'skipped')
      )
    runs-on: ubuntu-latest
    # The release gate: the `release` environment has the owner as a required reviewer, so this job - and the deploy
    # behind it - waits for an explicit approval in the Actions UI. It holds no secrets. The gate is its own
    # environment rather than a protection rule on `production` because `production` is also used by the frontend
    # image build and the daily backup-freshness check, and neither should wait for a person.
    environment: release
    steps:
      - run: echo "Approved deploying ${DEPLOY_SHA} to production"

  deploy:
    name: Deploy to Oracle
    needs: [approve]
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      # Independent of the workflow-level group above - this is what makes "one deploy at a time, queued not
      # cancelled" true even across two different pushes, not just within one run's own retries.
      group: production-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - name: Join the tailnet
        uses: tailscale/github-action@6cae46e2d796f265265cfcf628b72a32b4d7cade # v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Diagnose Tailscale connectivity
        # Two attempts at a fix already failed here (an "eventual consistency" retry loop still saw 20/20
        # timeouts over 4+ minutes - too long and too consistent for that explanation alone). Rather than guess a
        # third time, gather real evidence: does this ephemeral node get a real `tailscale0` kernel interface or
        # only userspace networking (would explain a TCP timeout from tools that don't know to use its SOCKS/HTTP
        # proxy); does `tailscale status` even list `vibecraft-k3s` as a peer; does a raw `tailscale ping` (ICMP
        # over WireGuard, nothing to do with port 6443 or Kubernetes) succeed where the TCP connection doesn't.
        run: |
          echo "--- tailscale status ---"
          sudo tailscale status || true
          echo "--- tailscale ip ---"
          sudo tailscale ip || true
          echo "--- tailscale0 interface ---"
          ip addr show tailscale0 2>&1 || echo "No tailscale0 interface - likely userspace networking, not kernel/TUN"
          echo "--- netcheck ---"
          sudo tailscale netcheck || true
          echo "--- ping the Oracle host (bypasses TCP/6443 entirely) ---"
          HOST=$(echo "$KUBE_API_SERVER" | sed -E 's#^[a-z]+://##; s#:[0-9]+$##')
          # Bare host, no scheme/port - `tailscale ping` wants a plain address. GitHub only auto-masks a log line
          # that's an exact match for a registered secret's full value, not a substring derived from it, and
          # `tailscale ping`'s own output echoes the target address back - `::add-mask::` explicitly registers
          # this derived value too, so it stays redacted in this public repo's logs.
          echo "::add-mask::$HOST"
          sudo tailscale ping --timeout=10s -c 3 "$HOST" || true
        env:
          KUBE_API_SERVER: ${{ secrets.KUBE_API_SERVER }}

      - uses: azure/setup-kubectl@776406bce94f63e41d621b960d78ee25c8b76ede # v4
        with:
          version: v1.31.0

      - name: Configure kubectl for the Oracle cluster
        # The deployer ServiceAccount's own bearer token (deploy/k8s/overlays/oracle/deployer-bootstrap.yaml),
        # not a full admin kubeconfig - scoped to just the two app namespaces, no cluster-admin. TLS verification
        # is skipped deliberately: the connection already only exists inside the authenticated, encrypted Tailscale
        # tunnel (both this runner and the API server must be authorized tailnet members first), which is the real
        # security boundary here, not the k8s API's own TLS cert - a deliberate simplification for a project this
        # size, not an oversight.
        run: |
          kubectl config set-cluster oracle --server="${{ secrets.KUBE_API_SERVER }}" --insecure-skip-tls-verify=true
          kubectl config set-credentials deployer --token="${{ secrets.KUBE_DEPLOYER_TOKEN }}"
          kubectl config set-context oracle --cluster=oracle --user=deployer --namespace=singularity
          kubectl config use-context oracle

      - name: Wait for the Oracle API server to become reachable
        # Tailscale's own "eventual consistency": a brand-new ephemeral node joining the tailnet doesn't mean
        # every existing peer already knows about it - `vibecraft-k3s` can keep refusing/timing out this node's
        # connections for a short, variable window right after it joins (live-verified: the very next step used to
        # fail here with a plain TCP i/o timeout). Retries the cheapest possible real call - `/livez`, which every
        # authenticated request can reach regardless of RBAC (k3s's default `system:public-info-viewer` binding) -
        # instead of guessing a fixed sleep or depending on a specific version of tailscale/github-action's own
        # input schema (an earlier attempt at this used its `ping` input, which the pinned `@v3` tag doesn't
        # actually have - this direct kubectl retry doesn't depend on that action's interface at all).
        run: |
          for i in $(seq 1 20); do
            if kubectl get --raw=/livez --request-timeout=10s > /dev/null 2>&1; then
              echo "Oracle API server reachable after attempt $i."
              exit 0
            fi
            echo "Attempt $i: API server not yet reachable, retrying in 5s..."
            sleep 5
          done
          echo "::error::Oracle API server never became reachable over Tailscale after 20 attempts."
          exit 1

      - name: Apply Kubernetes secrets from the production environment
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          MINIO_ROOT_PASSWORD: ${{ secrets.MINIO_ROOT_PASSWORD }}
          MINIO_RUNNER_SECRET: ${{ secrets.MINIO_RUNNER_SECRET }}
          INTERNAL_SERVICE_SHARED_SECRET: ${{ secrets.INTERNAL_SERVICE_SHARED_SECRET }}
          PREVIEW_ACCESS_TOKEN_SECRET: ${{ secrets.PREVIEW_ACCESS_TOKEN_SECRET }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          STRIPE_SECRET: ${{ secrets.STRIPE_SECRET }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          STRIPE_PRICE_PRO: ${{ secrets.STRIPE_PRICE_PRO }}
          STRIPE_PRICE_BUSINESS: ${{ secrets.STRIPE_PRICE_BUSINESS }}
          CLOUDFLARE_TUNNEL_CREDENTIALS: ${{ secrets.CLOUDFLARE_TUNNEL_CREDENTIALS }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: bash deploy/scripts/apply-secrets.sh

      - name: Set the real image tags and apply the oracle overlay
        run: |
          sed -i "s/REPLACED_BY_CI/${{ env.DEPLOY_SHA }}/g" deploy/k8s/overlays/oracle/kustomization.yaml
          kubectl apply -k deploy/k8s/overlays/oracle

      - name: Wait for each service to become ready
        # docs/deployment/'s deploy order: Postgres/MinIO/Redis, then discovery, then the three domain
        # services, then the gateway, frontend and proxy. `kubectl apply -k` doesn't sequence the actual rollout
        # itself, but checking readiness in this order still gives an early, specific failure (which service, not
        # just "the deploy is unhealthy") instead of one final timeout with no clue which pod never came up.
        run: |
          set -e
          kubectl -n singularity rollout status statefulset/postgres --timeout=5m
          kubectl -n singularity rollout status statefulset/minio --timeout=5m
          kubectl -n singularity-ai rollout status deployment/redis-server --timeout=5m
          kubectl -n singularity rollout status deployment/discovery-service --timeout=5m
          kubectl -n singularity rollout status deployment/account-service --timeout=5m
          kubectl -n singularity rollout status deployment/workspace-service --timeout=5m
          kubectl -n singularity rollout status deployment/intelligence-service --timeout=5m
          kubectl -n singularity rollout status deployment/gateway-service --timeout=5m
          kubectl -n singularity rollout status deployment/frontend --timeout=5m
          kubectl -n singularity-ai rollout status deployment/singularity-proxy --timeout=5m
          kubectl -n singularity-ai rollout status deployment/runner-pool --timeout=5m

      - name: Smoke test
        # app and preview no longer share a domain suffix (vars.APP_DOMAIN is `singularity.divyanshuagrahari.dev`,
        # a single-level subdomain - Cloudflare's free wildcard cert only covers one level, so previews stayed on
        # the pre-existing `*.divyanshuagrahari.dev`), so each is its own explicit GitHub variable now rather than
        # one derived from the other.
        run: bash deploy/scripts/smoke-test.sh "${{ vars.APP_DOMAIN }}" "${{ vars.PREVIEW_ROOT_DOMAIN }}"

      - name: Roll back on failure
        # Plain `failure()` - not just a failed smoke test, a rollout that never became Ready (the previous step)
        # is just as much "a failed rollout" as docs/deployment/'s own Phase 5 spec calls for rolling back.
        if: failure()
        run: |
          kubectl -n singularity rollout undo deployment/discovery-service
          kubectl -n singularity rollout undo deployment/account-service
          kubectl -n singularity rollout undo deployment/workspace-service
          kubectl -n singularity rollout undo deployment/intelligence-service
          kubectl -n singularity rollout undo deployment/gateway-service
          kubectl -n singularity rollout undo deployment/frontend
