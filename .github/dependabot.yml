# Weekly dependency update pull requests for everything that ships or builds: the Maven reactor, the frontend and the
# preview proxy (npm), the container base images, and the GitHub Actions the workflows use. The workflows pin each
# action to a commit SHA with its tag in a comment, which Dependabot keeps current - without it a pin goes stale.
#
# Security advisories open their own pull requests regardless of this schedule once Dependabot security updates are on
# in the repository settings.
version: 2
updates:
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directory: /proxy
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: docker
    directory: /frontend
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /proxy
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
