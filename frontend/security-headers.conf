# The static security headers every response from the SPA carries. frontend/nginx.conf includes this inside each
# location, never once at server level: nginx drops every header an outer level set as soon as a location sets one of
# its own (both locations set Cache-Control), so a server-level copy would silently not be sent.
#
# The Content-Security-Policy is not here: it depends on the origins a build is configured with, so the build writes it
# to csp-header.conf (vite.config.ts) and nginx.conf includes that beside this file.
#
# Cross-Origin-Opener-Policy is same-origin-allow-popups, not same-origin: Google sign-in opens a popup and reads its
# result back, and same-origin would sever that link.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
