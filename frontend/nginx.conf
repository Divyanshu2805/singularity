# SPA fallback (every non-file path resolves to index.html, so client-side routing survives a hard refresh on a
# deep link like /projects) plus a long cache for Vite's content-hashed assets - safe because a new build ships a
# new filename, never the same name with different content. index.html itself stays uncached so a deploy is visible
# on the next load rather than the next time a viewer's browser cache expires.
#
# Both locations include the security headers (security-headers.conf, and the build-generated csp-header.conf): see
# security-headers.conf for why they are repeated per location rather than set once here.
#
# Text is compressed here rather than left to whatever sits in front. The scripts and styles are about 1.9 MB as
# built and about 600 kB compressed; without this an in-cluster request, a health check through a port-forward or
# any path that skips the edge gets the full size. Only static files are served from this server, so there is no
# response here that mixes a secret with text an attacker chose, which is the case compression must avoid.
server {
    listen 8080;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        include /etc/nginx/snippets/csp-header.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        include /etc/nginx/snippets/security-headers.conf;
        include /etc/nginx/snippets/csp-header.conf;
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
