server:
  port: ${GATEWAY_SERVICE_PORT:8000}

# CODE_REVIEW.md DEP-036: liveness/readiness on a separate port, so /actuator/health never has to be a route in
# the table above - it's not reachable on server.port at all, and there is deliberately no catch-all route there
# for it to hide behind. Kubernetes probes hit management.server.port on the pod directly.
management:
  server:
    port: ${MANAGEMENT_SERVER_PORT:9404}
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      server:
        webflux:
          # Connections to the services are pooled and reused. One left idle is dropped here after 15 seconds,
          # well inside the time a service keeps an idle connection open itself, and none is kept for more than
          # ten minutes. Without this the Gateway could write a request onto a connection the service had just
          # closed: "Connection prematurely closed BEFORE response", a 500 to the browser - seen on
          # POST /api/chat/stream, where the browser was told the build had failed while it was in fact running.
          httpclient:
            pool:
              max-idle-time: 15s
              max-life-time: 10m
          # The browser's traffic goes to the three domain services, resolved through Eureka (lb://). A
          # transparent passthrough - no path rewriting, no header/cookie manipulation, no auth logic here;
          # every service runs its own full Firebase/session/CSRF chain.
          #
          # ORDER MATTERS (lower `order` wins): /api/projects/{id}/code/** belongs to intelligence-service but
          # sits under /api/projects/**, which belongs to workspace-service - so the more specific route has
          # to be evaluated first. RoutingTableTest pins this for every endpoint; run it after touching this
          # table.
          #
          # There is deliberately no catch-all route. /internal/** matches none of these, so the services'
          # machine-to-machine endpoints are never reachable from the browser's origin, and any other path
          # nothing owns is a 404 from the Gateway itself.
          #
          # The one thing every route does get is a request-size ceiling. No service limits a JSON body before it is
          # read into memory, so without this a single large POST is held in full by whichever pod receives it. The
          # largest legitimate body is a saved code-lens answer (60,000 characters, a few hundred KB at worst).
          # RequestSize judges the Content-Length header, so a chunked upload is not stopped here.
          default-filters:
            - name: RequestSize
              args:
                maxSize: 1MB
          # Without this the Gateway throws away the X-Forwarded-For its caller sent and starts a new one containing
          # only that caller's own address, so every request would reach the services as coming from the tunnel's pod.
          # Every caller is trusted here because the decision that matters is made later: each service reads the
          # client from the right of the list and skips only private-range hops (forward-headers-strategy: native in
          # its application.yaml), so entries a client forges at the left are never reached. A narrower pattern here
          # (private ranges only) was tried and the Gateway still dropped the header; it was not diagnosed further.
          trusted-proxies: ".*"
          routes:
            - id: intelligence-code-insight
              uri: ${routing.intelligence.uri}
              order: 10
              predicates:
                - Path=/api/projects/*/code/**

            - id: intelligence
              uri: ${routing.intelligence.uri}
              order: 20
              predicates:
                - Path=/api/chat/**,/api/ideas/**,/api/usage/**

            - id: workspace
              uri: ${routing.workspace.uri}
              order: 30
              predicates:
                - Path=/api/projects/**,/api/previews/**

            - id: account
              uri: ${routing.account.uri}
              order: 40
              predicates:
                - Path=/api/auth/**,/api/plans/**,/api/me/**,/api/payments/**,/webhooks/payment

routing:
  account:
    uri: ${ACCOUNT_ROUTE_URI:lb://account-service}
  workspace:
    uri: ${WORKSPACE_ROUTE_URI:lb://workspace-service}
  intelligence:
    uri: ${INTELLIGENCE_ROUTE_URI:lb://intelligence-service}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

logging:
  level:
    org.springframework.cloud.gateway: INFO
