# Who may open a connection to whom inside the cluster. Applied by hand, on purpose - see policies.yaml.
#
#   kubectl --context <cluster> apply -k deploy/k8s/network-policies
#   kubectl --context <cluster> delete -k deploy/k8s/network-policies     # puts everything back as it was
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - policies.yaml
