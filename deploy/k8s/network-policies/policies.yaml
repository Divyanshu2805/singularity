# Who may open a connection to whom, for the trusted workloads.
#
# Until these are applied, every pod in the cluster can reach every other one. The runner pods are already fenced
# (base/runner-pods.yaml: no private address ranges, MinIO only), so generated code cannot get here - what this
# closes is the step after one trusted pod is compromised: today the frontend's nginx, or the tunnel, could open a
# connection straight to Postgres, to MinIO, to Eureka's registry, or to another service's /internal/** endpoints.
# The shared secret on /internal/** and the databases' own passwords still stand; this is the wall in front of them.
#
# Only incoming connections are restricted. What a pod may connect out to is left alone: the services call
# Firebase, Stripe, the AI provider and the Kubernetes API, and a mistake in an outgoing rule (DNS, most often) stops
# a service in a way that is slow to recognise. Incoming rules fail plainly - a refused connection, named in a log.
#
# In `singularity` everything is refused unless a rule below allows it. In `singularity-ai` only Redis and the
# preview proxy are covered; the runner pods keep their own policy.
#
# Not part of base and not applied by CI. A wrong rule here takes the app down, and it has only been checked by
# reading the manifests, not on a running cluster. Apply it by hand, after a deploy, with the app open:
#
#   kubectl --context <cluster> apply -k deploy/k8s/network-policies
#
# then sign in, open a project, send one build and start one preview. `kubectl delete -k` on the same folder undoes
# it at once. Once it has run for a while it can be added to base/kustomization.yaml.
#
# The node's own probes are not affected: a connection from the node a pod runs on is always let in. `kubectl
# port-forward` is not affected either. It needs a network plugin that enforces NetworkPolicy; k3s does out of the
# box.
#
# A new workload that needs to reach one of these needs a line here, or its connections are refused: the published
# apps' reader, when publishing lands, needs MinIO from the preview proxy.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: singularity
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
# The tunnel is the only way in from outside. The frontend is allowed to reach the Gateway as well because the kind
# overlay's nginx proxies /api to it; in production nothing in the frontend pod does.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: gateway-from-tunnel
  namespace: singularity
spec:
  podSelector:
    matchLabels:
      app: gateway-service
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: cloudflared
        - podSelector:
            matchLabels:
              app: frontend
      ports:
        - protocol: TCP
          port: 8000
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: frontend-from-tunnel
  namespace: singularity
spec:
  podSelector:
    matchLabels:
      app: frontend
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: cloudflared
      ports:
        - protocol: TCP
          port: 8080
---
# Eureka: the four services that register with it or read it.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: discovery-from-services
  namespace: singularity
spec:
  podSelector:
    matchLabels:
      app: discovery-service
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: gateway-service
        - podSelector:
            matchLabels:
              app: account-service
        - podSelector:
            matchLabels:
              app: workspace-service
        - podSelector:
            matchLabels:
              app: intelligence-service
      ports:
        - protocol: TCP
          port: 8761
---
# Each domain service: the Gateway, and the other two - they call one another's /internal/** endpoints (session
# checks and evictions, membership, file reads, stopping a build).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: account-from-gateway-and-services
  namespace: singularity
spec:
  podSelector:
    matchLabels:
      app: account-service
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: gateway-service
        - podSelector:
            matchLabels:
              app: workspace-service
        - podSelector:
            matchLabels:
              app: intelligence-service
      ports:
        - protocol: TCP
          port: 8081
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: workspace-from-gateway-and-services
  namespace: singularity
spec:
  podSelector:
    matchLabels:
      app: workspace-service
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: gateway-service
        - podSelector:
            matchLabels:
              app: account-service
        - podSelector:
            matchLabels:
              app: intelligence-service
      ports:
        - protocol: TCP
          port: 8082
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: intelligence-from-gateway-and-services
  namespace: singularity
spec:
  podSelector:
    matchLabels:
      app: intelligence-service
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: gateway-service
        - podSelector:
            matchLabels:
              app: account-service
        - podSelector:
            matchLabels:
              app: workspace-service
      ports:
        - protocol: TCP
          port: 8083
---
# Postgres: the three services that own a database, the nightly backup, and a restore.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-from-owners
  namespace: singularity
spec:
  podSelector:
    matchLabels:
      app: postgres
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: account-service
        - podSelector:
            matchLabels:
              app: workspace-service
        - podSelector:
            matchLabels:
              app: intelligence-service
        - podSelector:
            matchLabels:
              app: nightly-backup
        - podSelector:
            matchLabels:
              app: restore-backup
      ports:
        - protocol: TCP
          port: 5432
---
# MinIO: workspace-service, the backup and a restore, the job that creates the runners' read-only user (a Job's pods
# carry its name as the job-name label), and the runner pods in the other namespace, which mirror a project's files.
# The console port (9001) is opened to nobody; use `kubectl port-forward` for it.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: minio-from-storage-users
  namespace: singularity
spec:
  podSelector:
    matchLabels:
      app: minio
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: workspace-service
        - podSelector:
            matchLabels:
              app: nightly-backup
        - podSelector:
            matchLabels:
              app: restore-backup
        - podSelector:
            matchLabels:
              job-name: minio-bootstrap-preview-reader
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: singularity-ai
          podSelector:
            matchLabels:
              app: runner
      ports:
        - protocol: TCP
          port: 9000
---
# Redis holds the preview routes: which hostname goes to which runner. Whoever can write to it can point a preview's
# hostname at another project's runner. workspace-service writes the routes and the proxy reads them; nothing else
# has a reason to connect.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: redis-from-router-and-proxy
  namespace: singularity-ai
spec:
  podSelector:
    matchLabels:
      app: redis
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: singularity-proxy
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: singularity
          podSelector:
            matchLabels:
              app: workspace-service
      ports:
        - protocol: TCP
          port: 6379
---
# The preview proxy: only the tunnel brings it traffic.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: proxy-from-tunnel
  namespace: singularity-ai
spec:
  podSelector:
    matchLabels:
      app: singularity-proxy
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: singularity
          podSelector:
            matchLabels:
              app: cloudflared
      ports:
        - protocol: TCP
          port: 8080
