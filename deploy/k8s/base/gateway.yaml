# The browser's single origin - a transparent Spring Cloud Gateway passthrough with no auth logic of its own,
# resolving the three domain services through Eureka. No database, no secrets.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-service
  namespace: singularity
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway-service
  template:
    metadata:
      labels:
        app: gateway-service
    spec:
      # Avoids Kubernetes' auto-injected `GATEWAY_SERVICE_PORT` colliding with this service's own override
      # placeholder of the same name - see discovery.yaml's comment for the full live-verified account.
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: gateway-service
          image: singularity-gateway:local
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          env:
            - name: EUREKA_SERVER_URL
              value: "http://discovery-service:8761/eureka/"
          ports:
            - containerPort: 8000
            - containerPort: 9404
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              # docs/deployment/kubernetes.md's resource-limits table.
              memory: "448Mi"
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 9404
            periodSeconds: 5
            initialDelaySeconds: 15
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 9404
            periodSeconds: 10
            initialDelaySeconds: 30

---

apiVersion: v1
kind: Service
metadata:
  name: gateway-service
  namespace: singularity
spec:
  selector:
    app: gateway-service
  ports:
    - port: 8000
      targetPort: 8000
  type: ClusterIP
