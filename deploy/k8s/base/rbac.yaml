# workspace-service's own identity - it's the only one of the five Java services that talks to the Kubernetes API
# (PreviewRunnerPool, fabric8 client). Lives in `singularity`; the pods it manages (base/runner-pods.yaml) live in
# `singularity-ai`, so the Role/RoleBinding below are cross-namespace - a RoleBinding's `subjects` can reference a
# ServiceAccount from a different namespace than the RoleBinding itself, as long as the Role it binds to lives in
# the SAME namespace as the RoleBinding (here, singularity-ai, where the governed pods actually are).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: workspace-service
  namespace: singularity

---

apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: workspace-service-runner-manager
  namespace: singularity-ai
rules:
  # Matches exactly what PreviewRunnerPool.java calls: list/get to find and check pods, patch to claim one
  # (the resourceVersion-guarded merge patch), delete to release one. No create - runner pods come from
  # runner-pods.yaml's Deployment, workspace-service only ever claims/releases existing ones.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "patch", "delete"]
  # The exec/file-upload subresource PreviewRunnerPool.exec/uploadFile use. fabric8 opens it as a WebSocket, which
  # is an HTTP GET, so RBAC checks "get" - "create" alone only covers the older SPDY transport (a POST), and
  # without "get" every exec is a 403 that PreviewRunnerPool reports as "Couldn't reach the preview cluster".
  # Keep both: newer API servers can also require "create" for the WebSocket upgrade.
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["get", "create"]

---

apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: workspace-service-runner-manager
  namespace: singularity-ai
subjects:
  - kind: ServiceAccount
    name: workspace-service
    namespace: singularity
roleRef:
  kind: Role
  name: workspace-service-runner-manager
  apiGroup: rbac.authorization.k8s.io
