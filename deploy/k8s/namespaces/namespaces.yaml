# Two namespaces (docs/deployment/'s architecture table): `singularity` holds every trusted workload -
# Postgres, MinIO, the five Spring Boot services, the frontend, and (oracle overlay only) cloudflared. `singularity-ai`
# holds the untrusted live-preview pipeline - Redis, the preview-proxy, and the runner pod pool that executes
# arbitrary, AI-generated project code (see CLAUDE.md's guardrail on that boundary). Keeping them apart means a
# NetworkPolicy in `singularity-ai` never has to reason about the trusted services sitting in the same namespace as
# the pods it's trying to contain.
#
# This is a DIFFERENT deployment shape from `k8s/*.yml` at the repo root, which stays as-is for day-to-day local
# development (backend runs outside the cluster via `mvnw`; only the preview pipeline - Redis, proxy, runner pool -
# lives in a `singularity-ai`-only kind cluster). `deploy/k8s/` is the full-stack topology this phase introduces:
# every service containerized and running in-cluster, rehearsed on kind before it ever touches a real server. Don't
# conflate the two - `k8s/` keeps serving docs/local-development/'s existing workflow untouched.
#
# Lives in its own directory, a sibling of base/ - not inside base/ itself, and not in base/kustomization.yaml's
# resources - deliberately, same reasoning as overlays/oracle/deployer-bootstrap.yaml. Kubernetes' built-in `admin`
# ClusterRole (what the `deployer` ServiceAccount is bound to - deployer-bootstrap.yaml) intentionally excludes
# Namespace/LimitRange/ResourceQuota: a namespace "admin" shouldn't be able to raise the resource ceiling a cluster
# admin imposed on it. Live-verified the hard way: every one of these three object types 403'd when they were part
# of the regular CI-driven `kubectl apply -k deploy/k8s/overlays/oracle` run. Apply this file once, out-of-band,
# with a privileged kubeconfig, before the deployer identity ever runs against a fresh cluster:
#   kubectl apply -k deploy/k8s/namespaces
# The kind overlay references this directory directly in its own kustomization.yaml instead, since kind's
# kubeconfig has no such restriction and Phase 3's rehearsal already depends on one `kubectl apply -k` creating
# everything in one shot. (It has to be a sibling directory with its own kustomization.yaml, not a bare file
# referenced across directories - Kustomize's security model forbids a raw file path from escaping the referencing
# kustomization's own root, but exempts references to another directory's self-contained kustomization.)
apiVersion: v1
kind: Namespace
metadata:
  name: singularity

---

apiVersion: v1
kind: Namespace
metadata:
  name: singularity-ai

---

# Defense in depth, same rationale as the existing `k8s/infra.yml` LimitRange/ResourceQuota for `singularity-ai`
# (CODE_REVIEW.md SEC-10): stops a manifest that forgets its own resources from shipping unbounded, and caps each
# namespace's total footprint regardless of replica count. Sized from docs/deployment/kubernetes.md's memory
# table - the trusted namespace runs one copy of each service plus the maintenance overhead of a rolling update.
apiVersion: v1
kind: LimitRange
metadata:
  name: singularity-limits
  namespace: singularity
spec:
  limits:
    - type: Container
      default:
        cpu: "500m"
        memory: "512Mi"
        ephemeral-storage: "512Mi"
      defaultRequest:
        cpu: "50m"
        memory: "128Mi"
        ephemeral-storage: "128Mi"
      max:
        cpu: "2"
        memory: "2Gi"
        ephemeral-storage: "4Gi"

---

apiVersion: v1
kind: ResourceQuota
metadata:
  name: singularity-quota
  namespace: singularity
spec:
  hard:
    pods: "20"
    requests.cpu: "4"
    requests.memory: "6Gi"
    limits.cpu: "8"
    limits.memory: "8Gi"

---

# singularity-ai's own LimitRange/ResourceQuota already exist in the repo-root `k8s/infra.yml` for the local-dev kind
# cluster; this file defines the equivalent pair for THIS topology's `singularity-ai` (same numbers - the untrusted
# preview pipeline's footprint doesn't change based on how the trusted side is deployed).
apiVersion: v1
kind: LimitRange
metadata:
  name: singularity-ai-limits
  namespace: singularity-ai
spec:
  limits:
    - type: Container
      default:
        cpu: "500m"
        memory: "512Mi"
        ephemeral-storage: "512Mi"
      defaultRequest:
        cpu: "50m"
        memory: "64Mi"
        ephemeral-storage: "64Mi"
      max:
        cpu: "2"
        memory: "2Gi"
        ephemeral-storage: "4Gi"

---

apiVersion: v1
kind: ResourceQuota
metadata:
  name: singularity-ai-quota
  namespace: singularity-ai
spec:
  hard:
    pods: "20"
    requests.cpu: "4"
    requests.memory: "4Gi"
    limits.cpu: "12"
    limits.memory: "12Gi"
