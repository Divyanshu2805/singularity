# The only public entry point into the whole deployment - the VM itself has zero open inbound ports
# (docs/deployment/'s architecture diagram). Oracle-only: kind reaches everything through kubectl
# port-forward instead, so this file lives in the oracle overlay, not base.
#
# The tunnel is created once, out-of-band, in the Cloudflare dashboard (docs/deployment/provisioning.md - already
# done) - this Deployment just runs the daemon that connects to it. Credentials come from a Secret, never baked in:
#   kubectl create secret generic cloudflared-credentials -n singularity \
#     --from-literal=credentials.json='<the tunnel credentials JSON - CLOUDFLARE_TUNNEL_CREDENTIALS in the plan>'
#
# A throwaway `hello-test` nginx pod (not part of this repo) proved HTTPS-in/zero-open-ports end to end in Phase
# 0/1, before any of this existed - superseded and deleted once Phase 5's CI/CD pipeline applied the real routing
# config for the first time. The `cloudflared-config` ConfigMap this Deployment mounts is generated by
# kustomization.yaml's `configMapGenerator` from cloudflared-config.yaml, not defined here - see that file's own
# comment for why (a plain same-named ConfigMap doesn't force cloudflared to reload it).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared
  namespace: singularity
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cloudflared
  template:
    metadata:
      labels:
        app: cloudflared
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532 # cloudflared's own non-root `nonroot` image user
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: cloudflared
          image: cloudflare/cloudflared:2026.9.1
          args: ["tunnel", "--config", "/etc/cloudflared/config.yaml", "run"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: "20m"
              memory: "32Mi"
            limits:
              cpu: "200m"
              # docs/deployment/kubernetes.md's resource-limits table.
              memory: "128Mi"
          volumeMounts:
            - name: config
              mountPath: /etc/cloudflared
              readOnly: true
            - name: creds
              mountPath: /etc/cloudflared/creds
              readOnly: true
          readinessProbe:
            httpGet:
              path: /ready
              port: 2000
            periodSeconds: 10
      volumes:
        - name: config
          configMap:
            name: cloudflared-config
        - name: creds
          secret:
            secretName: cloudflared-credentials
