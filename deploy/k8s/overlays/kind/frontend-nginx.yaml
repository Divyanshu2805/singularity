# kind-only: the frontend's browser code calls the API with relative paths (frontend/src/lib/api.ts's
# VITE_API_BASE_URL default), which only works when the frontend and the Gateway are actually the same origin - true
# in production (cloudflared routes both under one hostname) and true in local `mvnw` dev (Vite's own dev-server
# proxy, vite.config.ts), but NOT true here: kubectl port-forward puts frontend and the Gateway on two different
# localhost ports with nothing unifying them. This ConfigMap overrides the image's baked-in nginx.conf (same
# mount path) with one extra proxy_pass, purely so this overlay's rehearsal can exercise a real browser session -
# the shipped image and the oracle overlay are untouched, cloudflared does this job for real.
apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-nginx-rehearsal
  namespace: singularity
data:
  default.conf: |
    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;

        location /api/ {
            proxy_pass http://gateway-service.singularity.svc.cluster.local:8000;
            proxy_set_header Host $host;
        }

        location /webhooks/ {
            proxy_pass http://gateway-service.singularity.svc.cluster.local:8000;
            proxy_set_header Host $host;
        }

        location /assets/ {
            include /etc/nginx/snippets/security-headers.conf;
            include /etc/nginx/snippets/csp-header.conf;
            add_header Cache-Control "public, max-age=31536000, immutable";
            try_files $uri =404;
        }

        location / {
            include /etc/nginx/snippets/security-headers.conf;
            include /etc/nginx/snippets/csp-header.conf;
            add_header Cache-Control "no-cache";
            try_files $uri /index.html;
        }
    }
