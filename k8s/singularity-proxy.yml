apiVersion: v1
kind: ServiceAccount
metadata:
  name: singularity-proxy
  namespace: singularity-ai

---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: singularity-proxy
  namespace: singularity-ai
spec:
  replicas: 1
  selector:
    matchLabels:
      app: singularity-proxy
  template:
    metadata:
      labels:
        app: singularity-proxy
    spec:
      # CODE_REVIEW.md OPS-01: the same least-privilege pattern k8s/runner-pods.yml already has and had live-verified
      # (SEC-08/09/10) - this manifest never had it, unlike the pods it sits in front of. No Role/RoleBinding is
      # granted (same reasoning as preview-runner in runner-pods.yml): this ServiceAccount exists only so the pod
      # isn't implicitly `default`, and automountServiceAccountToken is false anyway.
      serviceAccountName: singularity-proxy
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000 # the `node` user baked into the node:20.20.2-alpine base image (proxy/Dockerfile)
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: proxy
          image: singularity-proxy:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
          env:
            - name: REDIS_URL
              # Refers to the service in the same namespace
              value: "redis://redis-service:6379"
            - name: PREVIEW_ACCESS_TOKEN_SECRET
              # Must be byte-for-byte the same value as the backend's PREVIEW_ACCESS_TOKEN_SECRET (.env) - it's how
              # this proxy verifies the token PreviewAccessToken.java signs (CODE_REVIEW.md SEC-06). Create the
              # Secret once per cluster: kubectl create secret generic preview-access-token -n singularity-ai
              # --from-literal=secret='<same value as the backend .env>'
              valueFrom:
                secretKeyRef:
                  name: preview-access-token
                  key: secret
            # A non-root process can't bind port 80 (needs CAP_NET_BIND_SERVICE or root) - rather than grant that
            # capability back, listen on an unprivileged port instead (proxy/index.js already reads PORT) and let
            # the Service below remap its own external port 80 to this one. No external behavior change.
            - name: PORT
              value: "8080"
            # Published apps (docs/architecture/decisions/0008-published-apps.md): any hostname that is one label under
            # PUBLISHED_DOMAIN and is not a preview's is served from the published-apps bucket with a read-only user.
            # Create the user's secret once per cluster, with the same value minio-bootstrap-published-reader uses:
            #   kubectl create secret generic minio-published-credentials -n singularity-ai --from-literal=password='...'
            - name: PUBLISHED_DOMAIN
              value: "localhost"
            - name: PUBLISHED_SCHEME
              value: "http"
            - name: PUBLISHED_APP_URL
              value: "http://localhost:8080/"
            - name: PUBLISHED_FRAME_ANCESTORS
              value: "http://localhost:8080 http://localhost:5173"
            - name: PUBLISHED_BUCKET
              value: "published-apps"
            - name: MINIO_ENDPOINT
              value: "http://minio-service:9000"
            - name: MINIO_ACCESS_KEY
              value: "publishedreader"
            - name: MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: minio-published-credentials
                  key: password
          ports:
            - containerPort: 8080
          readinessProbe:
            tcpSocket:
              port: 8080
            periodSeconds: 5

---

apiVersion: v1
kind: Service
metadata:
  name: singularity-proxy-svc
  namespace: singularity-ai
spec:
  # ClusterIP, not LoadBalancer: on kind this was always pending forever anyway (no load balancer to provision),
  # reached locally through k8s/dev-port-forward.ps1/.sh's kubectl port-forward - which targets a Service's
  # ClusterIP either way, so this changes nothing for local dev. On a real cluster, LoadBalancer would have
  # provisioned a public external IP with no authentication in front of it; the Cloudflare tunnel is meant to be
  # the only public entry point, reaching this Service privately from inside the cluster.
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 8080
  selector:
    app: singularity-proxy