apiVersion: v1
kind: Namespace
metadata:
  # Everything for previews lives here; preview.namespace in application.yaml must match.
  name: singularity-ai

---

# Defense in depth for CODE_REVIEW.md SEC-10: every container in k8s/runner-pods.yml and this file already sets its
# own CPU/memory/ephemeral-storage requests and limits, but this is what stops a future manifest change from
# quietly shipping an unbounded container, and what caps the whole namespace's footprint regardless of how many
# runner replicas end up scheduled. It does not bound PIDs per pod - that needs a kubelet `--pod-max-pids` flag or a
# RuntimeClass, both cluster-level settings no namespaced object can express; a fork bomb inside a runner is not
# stopped by anything in this file. Don't treat this as closing SEC-10 by itself.
apiVersion: v1
kind: LimitRange
metadata:
  name: singularity-ai-limits
  namespace: singularity-ai
spec:
  limits:
    - type: Container
      default:
        cpu: "500m"
        memory: "512Mi"
        ephemeral-storage: "512Mi"
      defaultRequest:
        cpu: "50m"
        memory: "64Mi"
        ephemeral-storage: "64Mi"
      max:
        cpu: "2"
        memory: "2Gi"
        ephemeral-storage: "4Gi"

---

apiVersion: v1
kind: ResourceQuota
metadata:
  name: singularity-ai-quota
  namespace: singularity-ai
spec:
  hard:
    pods: "20"
    requests.cpu: "4"
    requests.memory: "4Gi"
    limits.cpu: "12"
    limits.memory: "12Gi"

---

# MinIO itself is NOT defined here any more (docs/local-development/live-previews.md) - apply exactly one
# of k8s/minio-hostbridge.yml (local kind dev, bridges to the laptop's own docker-compose MinIO) or k8s/minio.yml
# (a real in-cluster MinIO, for an actual deployment) after this file. Both define a Service named minio-service
# in this namespace; applying both is a mistake, not a valid combined configuration.

apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-server
  namespace: singularity-ai
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      # CODE_REVIEW.md OPS-01: this image runs as root by default - checked live (`id` inside a running container
      # returned uid=0) - even though it ships a non-root `redis` user (uid 999, gid 1000, confirmed via
      # /etc/passwd) nothing here asked for it. No volume is mounted (Redis here is pure reconstructible routing
      # cache - nothing to persist), so dropping to the non-root user needs no
      # further filesystem changes.
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: redis
          # Pinned to the version actually running when this was checked, not the floating `7-alpine` major-version
          # tag.
          image: redis:7.4.11-alpine
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 6379
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "128Mi"

---

apiVersion: v1
kind: Service
metadata:
  name: redis-service
  namespace: singularity-ai
spec:
  selector:
    app: redis
  ports:
    - protocol: TCP
      port: 6379
      targetPort: 6379
  type: ClusterIP

---

# CODE_REVIEW.md OPS-01: a least-privilege identity for workspace-service's own K8s API access (PreviewRunnerPool's
# fabric8 client - claiming/releasing runner pods, exec-ing commands and uploading files into them). Forward-looking:
# workspace-service itself doesn't run inside this cluster yet (docs/local-development/ - it reads a developer's
# local kubeconfig, which is full-privilege, not scoped by anything here), so nothing binds this ServiceAccount to a
# running pod today. It exists so that when workspace-service does get deployed in-cluster, there's already a
# narrowly-scoped identity to give it instead of the implicit `default` ServiceAccount - the same gap runner-pods.yml
# already closes for the pods it manages, just not yet for the manager itself.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: workspace-service
  namespace: singularity-ai

---

apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: workspace-service-runner-manager
  namespace: singularity-ai
rules:
  # Matches exactly what PreviewRunnerPool.java calls: list/get to find and check pods, patch to claim one
  # (the resourceVersion-guarded merge patch), delete to release one. No create - runner pods themselves come
  # from the Deployment in this file, workspace-service only ever claims/releases existing ones.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "patch", "delete"]
  # The exec/file-upload subresource PreviewRunnerPool.exec/uploadFile use. fabric8 opens it as a WebSocket, which
  # is an HTTP GET, so RBAC checks "get" - "create" alone only covers the older SPDY transport (a POST).
  # Keep both: newer API servers can also require "create" for the WebSocket upgrade.
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["get", "create"]

---

apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: workspace-service-runner-manager
  namespace: singularity-ai
subjects:
  - kind: ServiceAccount
    name: workspace-service
    namespace: singularity-ai
roleRef:
  kind: Role
  name: workspace-service-runner-manager
  apiGroup: rbac.authorization.k8s.io