# MinIO for LOCAL KIND DEV ONLY - not for a real deployment. Bridges the cluster to the developer's own laptop,
# where `services.docker-compose.yml` already runs a real MinIO on the host. Apply EXACTLY ONE of this file or
# k8s/minio.yml, never both: both define a Service named minio-service in this namespace, and applying the second
# silently overwrites whatever the first created.
apiVersion: v1
kind: Service
metadata:
  name: minio-service
  namespace: singularity-ai
spec:
  type: ExternalName
  externalName: host.docker.internal # Points to your laptop/host
  ports:
    - port: 9000
      targetPort: 9000
      protocol: TCP
